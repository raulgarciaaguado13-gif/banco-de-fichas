<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1830" media="(prefers-color-scheme: dark)">
<title>Banco de Fichas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#F0F4FB;
    --paper-2:#E2EAF7;
    --card:#FFFFFF;
    --ink:#132542;
    --ink-soft:#4E6382;
    --ink-faint:#8598B3;
    --line:rgba(19,37,66,0.14);
    --line-strong:rgba(19,37,66,0.28);
    --accent:#2A5CD6;
    --accent-ink:#FFFFFF;
    --accent-2:#0E7C96;
    --accent-2-ink:#F2FBFD;
    --good:#2F8F5B;
    --good-ink:#F3FAF6;
    --bad:#C23B3B;
    --bad-ink:#FFF6F4;
    --focus-ring:#2A5CD6;
    --shadow:0 1px 0 rgba(19,37,66,0.05), 0 10px 24px -14px rgba(19,37,66,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0B1830;
      --paper-2:#102244;
      --card:#17294D;
      --ink:#E9F0FB;
      --ink-soft:#A9BEDA;
      --ink-faint:#7D93B3;
      --line:rgba(233,240,251,0.14);
      --line-strong:rgba(233,240,251,0.26);
      --accent:#5B9BFF;
      --accent-ink:#071227;
      --accent-2:#3FC1D9;
      --accent-2-ink:#062024;
      --good:#4FBE86;
      --good-ink:#06180F;
      --bad:#E1584F;
      --bad-ink:#210806;
      --focus-ring:#5B9BFF;
      --shadow:0 1px 0 rgba(0,0,0,0.2), 0 14px 30px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0B1830;
    --paper-2:#102244;
    --card:#17294D;
    --ink:#E9F0FB;
    --ink-soft:#A9BEDA;
    --ink-faint:#7D93B3;
    --line:rgba(233,240,251,0.14);
    --line-strong:rgba(233,240,251,0.26);
    --accent:#5B9BFF;
    --accent-ink:#071227;
    --accent-2:#3FC1D9;
    --accent-2-ink:#062024;
    --good:#4FBE86;
    --good-ink:#06180F;
    --bad:#E1584F;
    --bad-ink:#210806;
    --focus-ring:#5B9BFF;
    --shadow:0 1px 0 rgba(0,0,0,0.2), 0 14px 30px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces", Georgia, serif;
    text-wrap:balance;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  a{color:inherit;}

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--focus-ring);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{
    max-width:1040px;
    margin:0 auto;
    padding:24px 20px calc(80px + env(safe-area-inset-bottom));
    padding-left:calc(20px + env(safe-area-inset-left));
    padding-right:calc(20px + env(safe-area-inset-right));
  }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    padding:14px 20px;
    padding-top:calc(14px + env(safe-area-inset-top));
    padding-left:calc(20px + env(safe-area-inset-left));
    padding-right:calc(20px + env(safe-area-inset-right));
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:44px;height:44px;
    border-radius:6px;
    background:var(--accent);
    color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    font-family:"Fraunces", serif;
    font-weight:700;
    font-size:20px;
    box-shadow:var(--shadow);
    transform:rotate(-3deg);
  }
  .brand-text h1{font-size:22px;margin:0;}
  .brand-text p{margin:0;color:var(--ink-soft);font-size:13px;}

  .theme-toggle{
    appearance:none;
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1px solid var(--line-strong);
    background:var(--card);
    color:var(--ink-soft);
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:.03em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{color:var(--ink); border-color:var(--ink-soft);}
  .theme-toggle .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }

  .btn{
    appearance:none;
    border:1px solid var(--line-strong);
    background:var(--card);
    color:var(--ink);
    padding:10px 16px;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover{border-color:var(--ink-soft);}
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-quiet{
    background:transparent;
    border-color:transparent;
    color:var(--ink-soft);
    padding:8px 10px;
  }
  .btn-quiet:hover{color:var(--ink); background:var(--paper-2);}
  .btn-danger{color:var(--bad); border-color:var(--line-strong); background:var(--card);}
  .btn-danger:hover{border-color:var(--bad);}
  .btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}
  .btn-sm{padding:6px 11px; font-size:13px;}
  .btn-full{width:100%; justify-content:center;}

  /* ---------- Home: deck grid ---------- */
  .section-label{
    font-family:"IBM Plex Mono", monospace;
    text-transform:uppercase;
    letter-spacing:.09em;
    font-size:11px;
    color:var(--ink-faint);
    margin:0 0 12px;
  }
  .deck-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px;
  }
  .deck-tile{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px 8px 4px 4px;
    padding:20px 18px 16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:150px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .deck-tile:hover{transform:translateY(-2px);}
  .deck-tile .tab{
    position:absolute;
    top:-8px; left:18px;
    width:44px; height:14px;
    border-radius:3px 3px 0 0;
  }
  .deck-tile .punch{
    position:absolute;
    top:14px; right:14px;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--paper);
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.25);
  }
  .deck-tile h3{font-size:19px; margin:6px 0 0; padding-right:18px;}
  .deck-tile .count{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--ink-faint);
  }
  .deck-tile .preview{
    font-size:13px;
    color:var(--ink-soft);
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .deck-tile .row-actions{
    display:flex;
    gap:8px;
    margin-top:4px;
  }
  .deck-tile .row-actions .btn{flex:1;}

  .new-deck-tile{
    border:1px dashed var(--line-strong);
    border-radius:8px;
    background:transparent;
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink-soft);
    font-weight:600;
    cursor:pointer;
    gap:8px;
  }
  .new-deck-tile:hover{color:var(--ink); border-color:var(--ink-soft);}

  .inline-form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px;
    box-shadow:var(--shadow);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .inline-form input{flex:1; min-width:180px;}

  input[type="text"], textarea, select{
    background:var(--paper);
    border:1px solid var(--line-strong);
    border-radius:5px;
    color:var(--ink);
    padding:10px 12px;
    font-size:16px;
    font-family:inherit;
    max-width:100%;
  }
  textarea{width:100%; resize:vertical; font-family:"IBM Plex Mono", monospace; font-size:13px;}

  .confirm-row{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--bad); font-weight:600;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state h2{font-size:24px; margin:0 0 8px;}
  .empty-state p{max-width:420px; margin:0 auto 18px;}

  /* ---------- Deck detail ---------- */
  .deck-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--ink-soft); font-size:13px; font-weight:600;
    background:none; border:none; cursor:pointer; padding:0; margin-bottom:10px;
  }
  .back-link:hover{color:var(--ink);}
  .deck-title-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .deck-title-row h2{font-size:28px; margin:0;}
  .deck-title-row input{font-family:"Fraunces",serif; font-size:24px; font-weight:600; padding:4px 8px;}
  .deck-meta{color:var(--ink-soft); font-size:13px; margin-top:4px;}

  .deck-actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* ---------- Practice panel (progress ring + filters) ---------- */
  .practice-panel{
    display:flex;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px 20px;
    margin-bottom:22px;
    box-shadow:var(--shadow);
  }
  .practice-empty{color:var(--ink-soft); font-size:14px; margin:0;}
  .progress-ring-wrap{display:flex; align-items:center; gap:16px;}
  .progress-ring{
    width:72px; height:72px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .progress-ring-hole{
    width:50px; height:50px;
    border-radius:50%;
    background:var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
  }
  .progress-legend{display:flex; flex-direction:column; gap:5px;}
  .legend-row{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft);}
  .legend-row .dot{width:9px;height:9px;border-radius:50%; flex-shrink:0;}
  .legend-row b{color:var(--ink); font-weight:600;}
  .practice-actions{flex:1; min-width:220px;}
  .filter-buttons{display:flex; gap:8px; flex-wrap:wrap;}
  .quiz-filter-btn{font-size:13px; padding:8px 13px;}

  .deck-body{
    display:grid;
    grid-template-columns:300px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:760px){ .deck-body{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
    box-shadow:var(--shadow);
  }
  .panel h3{font-size:15px; margin:0 0 12px;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .field label{font-size:12px; color:var(--ink-soft); font-weight:600;}

  .card-search{margin-bottom:14px;}

  .card-list{display:flex; flex-direction:column; gap:10px;}
  .flash-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:14px;
    align-items:center;
  }
  @media (max-width:600px){ .flash-row{grid-template-columns:1fr; } }
  .flash-row .term{font-family:"Fraunces",serif; font-weight:600; font-size:16px;}
  .flash-row .def{color:var(--ink-soft); font-size:14px;}
  .flash-row .actions{display:flex; gap:6px; justify-self:end;}
  .flash-row.editing{grid-template-columns:1fr;}
  .flash-row .edit-fields{display:flex; gap:10px; flex-wrap:wrap;}
  .flash-row .edit-fields input{flex:1; min-width:160px;}
  .flash-row .edit-actions{display:flex; gap:8px; margin-top:8px;}

  .icon-btn{
    width:36px;height:36px;
    border-radius:6px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:14px;
  }
  .icon-btn:hover{background:var(--paper-2); color:var(--ink);}

  /* ---------- Bulk import modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(10,14,8,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal{
    background:var(--card);
    border-radius:10px;
    border:1px solid var(--line);
    max-width:560px; width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:24px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .modal h3{margin:0 0 4px; font-size:20px;}
  .modal .sub{color:var(--ink-soft); font-size:13px; margin:0 0 16px;}
  .modal-row{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .modal-row label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .preview-line{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--ink-faint);
    margin-top:8px;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  /* ---------- Quiz stage ---------- */
  .quiz-stage{
    background:var(--paper-2);
    border-radius:14px;
    padding:32px 24px 40px;
    min-height:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .quiz-top{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:26px;
  }
  .quiz-counter{font-family:"IBM Plex Mono", monospace; font-size:13px; color:var(--ink-soft); white-space:nowrap;}
  .perforation{
    flex:1;
    height:6px;
    border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 8px);
    overflow:hidden;
    position:relative;
  }
  .perforation-fill{
    position:absolute; inset:0;
    width:0%;
    background:var(--accent-2);
    border-radius:3px;
    transition:width .3s ease;
  }
  .score-pill{
    font-family:"IBM Plex Mono", monospace;
    font-size:13px;
    color:var(--good);
    font-weight:600;
    white-space:nowrap;
  }

  .quiz-card{
    background:var(--card);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:44px 36px;
    width:100%;
    max-width:640px;
    text-align:center;
    margin-bottom:28px;
  }
  .quiz-eyebrow{
    font-family:"IBM Plex Mono", monospace;
    text-transform:uppercase;
    letter-spacing:.09em;
    font-size:11px;
    color:var(--ink-faint);
    margin:0 0 14px;
  }
  .quiz-term{
    font-size:clamp(24px, 4vw, 34px);
    margin:0;
    text-wrap:balance;
  }

  .options-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    max-width:640px;
  }
  @media (max-width:560px){ .options-grid{grid-template-columns:1fr;} }
  .option-btn{
    text-align:left;
    background:var(--card);
    border:1px solid var(--line-strong);
    border-radius:8px;
    padding:16px 18px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .12s ease, transform .12s ease, background .12s ease;
    display:flex;
    gap:10px;
  }
  .option-btn .letter{
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    color:var(--ink-faint);
    flex-shrink:0;
  }
  .option-btn:hover:not(:disabled){border-color:var(--accent-2); transform:translateY(-1px);}
  .option-btn:disabled{cursor:default;}
  .option-btn.correct{background:var(--good); border-color:var(--good); color:var(--good-ink);}
  .option-btn.correct .letter{color:var(--good-ink);}
  .option-btn.wrong{background:var(--bad); border-color:var(--bad); color:var(--bad-ink);}
  .option-btn.wrong .letter{color:var(--bad-ink);}
  .option-btn.dim{opacity:0.5;}

  .reveal-wrap{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:center;
    margin-bottom:8px;
  }
  .reveal-btn{
    padding:16px 40px;
    font-size:16px;
  }

  .quiz-next{margin-top:24px; min-width:160px; justify-content:center;}
  .quiz-exit{margin-top:10px;}

  /* ---------- Summary ---------- */
  .summary-wrap{
    max-width:640px;
    margin:0 auto;
    text-align:center;
  }
  .stamp{
    display:inline-block;
    border:3px solid var(--accent);
    color:var(--accent);
    font-family:"IBM Plex Mono", monospace;
    font-weight:700;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:.08em;
    padding:10px 22px;
    border-radius:6px;
    transform:rotate(-4deg);
    margin-bottom:18px;
  }
  .summary-score{font-size:48px; margin:6px 0;}
  .summary-sub{color:var(--ink-soft); margin:0 0 26px;}
  .missed-list{
    text-align:left;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:24px;
  }
  .missed-list h3{font-size:14px; margin:0 0 10px; color:var(--ink-soft);}
  .missed-item{padding:9px 0; border-top:1px solid var(--line);}
  .missed-item:first-of-type{border-top:none;}
  .missed-item .term{font-weight:600;}
  .missed-item .def{color:var(--ink-soft); font-size:14px;}
  .missed-note{font-size:12px; color:var(--ink-faint); margin:12px 0 0; font-style:italic;}
  .summary-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}

  /* ---------- Toasts ---------- */
  .toast-wrap{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom));
    right:calc(20px + env(safe-area-inset-right));
    left:20px;
    display:flex; flex-direction:column; align-items:flex-end; gap:8px;
    z-index:80;
    pointer-events:none;
  }
  .toast-wrap .toast{ pointer-events:auto; max-width:min(360px, 100%); }
  .toast{
    background:var(--ink);
    color:var(--paper);
    padding:11px 16px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    box-shadow:0 10px 24px -8px rgba(0,0,0,0.4);
    animation:toast-in .18s ease;
  }
  @keyframes toast-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .checkbox-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
  .checkbox-row input{accent-color:var(--accent-2);}

  /* ---------- Auth gate ---------- */
  body:not(.authed) .site-header,
  body:not(.authed) .app{
    display:none;
  }
  .authed #auth-gate{
    display:none;
  }
  #auth-gate{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    padding:20px;

  }

  }

    padding:11px 12px;

    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  .auth-field input:focus-visible{outline:2px solid var(--focus-ring); outline-offset:1px;}
  .auth-error{
    width:100%;
    background:var(--bad-ink);
    color:var(--bad);
    border:1px solid var(--bad);

    font-size:13px;
    margin-bottom:14px;
    text-align:left;
  }
  .auth-submit{width:100%; margin-top:4px;}

    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(3px);}
  }

  }
  .sync-badge.sync-cloud{color:var(--good);}
  .sync-badge.sync-error{color:var(--bad);}

  function updateMastery(card, correct){
    if (correct){
      if (card.status === "new") card.status = "learning";
      else if (card.status === "learning") card.status = "mastered";
      // ya dominada + acierto -> se queda dominada
    } else {
      card.status = "learning"; // cualquier fallo (incluso desde dominada) vuelve a "en proceso"
    }
  }

  function statusCounts(deck){
    var c = { "new":0, "learning":0, "mastered":0 };
    deck.cards.forEach(function(card){ c[card.status]++; });
    return c;
  }

  function poolByStatus(deck, statusFilter){
    if (!statusFilter || statusFilter === "all") return deck.cards.slice();
    return deck.cards.filter(function(c){ return c.status === statusFilter; });
  }

  var decks = loadDecks();

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); }
    catch(e){ toast("No se pudo guardar: almacenamiento local no disponible."); }
    if (typeof schedulePush === "function") schedulePush();
  }

  function findDeck(id){
    for (var i=0;i<decks.length;i++) if (decks[i].id===id) return decks[i];
    return null;
  }

  /* ===================== Utilities ===================== */
  function esc(s){
    return String(s==null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function el(html){
    var t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }

  function toast(msg){
    var wrap = document.getElementById("toasts");
    var node = el('<div class="toast">'+esc(msg)+'</div>');
    wrap.appendChild(node);
    setTimeout(function(){
      node.style.transition = "opacity .25s ease";
      node.style.opacity = "0";
      setTimeout(function(){ node.remove(); }, 260);
    }, 2400);
  }

  /* ===================== Router / state ===================== */
  var route = { view: "home" };
  var app = document.getElementById("app");

  function go(next){
    route = next;
    render();
    window.scrollTo({top:0, behavior: "instant" in window ? "instant" : "auto"});
  }

  function render(){
    if (route.view === "home") return renderHome();
    if (route.view === "deck") return renderDeckView(route.deckId);
    if (route.view === "quiz") return renderQuizView();
    if (route.view === "summary") return renderSummaryView();
  }

  /* ===================== Home ===================== */
  var showNewDeckForm = false;

  function renderHome(){
    var html = '';

    if (decks.length === 0 && !showNewDeckForm){
      html += '<div class="empty-state">'
        + '<h2>Todavía no hay mazos</h2>'
        + '<p>Un mazo es un grupo de fichas — por ejemplo, el vocabulario de un idioma o los términos de un examen. Crea el primero para empezar.</p>'
        + '<button class="btn btn-primary" id="btn-new-deck">+ Crear mi primer mazo</button>'
        + '</div>';
      app.innerHTML = html;
      document.getElementById("btn-new-deck").onclick = function(){ showNewDeckForm = true; renderHome(); };
      return;
    }

    html += '<p class="section-label">Mazos (' + decks.length + ')</p>';
    html += '<div class="deck-grid">';

    decks.forEach(function(d){
      var count = d.cards.length;
      var preview = d.cards.slice(0,3).map(function(c){ return esc(c.term); }).join(" · ");
      html += '<div class="deck-tile" data-deck="'+d.id+'" tabindex="0" role="button" aria-label="Abrir mazo '+esc(d.name)+'">'
        + '<div class="tab" style="background:'+d.color+'"></div>'
        + '<div class="punch"></div>'
        + '<h3>'+esc(d.name)+'</h3>'
        + '<div class="count mono">'+count+' ficha'+(count===1?'':'s')+'</div>'
        + '<div class="preview">'+(preview || 'Sin fichas todavía')+'</div>'
        + '<div class="row-actions">'
        +   '<button class="btn btn-sm open-deck" data-deck="'+d.id+'">Abrir</button>'
        +   '<button class="btn btn-sm btn-primary start-quiz" data-deck="'+d.id+'" '+(count<2?'disabled title="Añade al menos 2 fichas"':'')+'>Test</button>'
        + '</div>'
        + '</div>';
    });

    html += '<button class="new-deck-tile" id="btn-new-deck">+ Nuevo mazo</button>';
    html += '</div>';

    if (showNewDeckForm){
      html += '<div style="margin-top:18px;" class="inline-form">'
        + '<input type="text" id="new-deck-name" placeholder="Nombre del mazo, p. ej. Vocabulario de biología" maxlength="60">'
        + '<button class="btn btn-primary" id="confirm-new-deck">Crear</button>'
        + '<button class="btn btn-quiet" id="cancel-new-deck">Cancelar</button>'
        + '</div>';
    }

    app.innerHTML = html;

    document.querySelectorAll(".deck-tile").forEach(function(tile){
      tile.addEventListener("click", function(e){
        if (e.target.closest("button")) return;
        go({view:"deck", deckId: tile.getAttribute("data-deck")});
      });
      tile.addEventListener("keydown", function(e){
        if (e.key === "Enter") go({view:"deck", deckId: tile.getAttribute("data-deck")});
      });
    });
    document.querySelectorAll(".open-deck").forEach(function(b){
      b.onclick = function(){ go({view:"deck", deckId:b.getAttribute("data-deck")}); };
    });
    document.querySelectorAll(".start-quiz").forEach(function(b){
      b.onclick = function(){
        var d = findDeck(b.getAttribute("data-deck"));
        if (d) beginQuiz(d, {reverse:false, statusFilter:"all"});
      };
    });
    var newBtn = document.getElementById("btn-new-deck");
    if (newBtn) newBtn.onclick = function(){ showNewDeckForm = true; renderHome(); };

    var nameInput = document.getElementById("new-deck-name");
    if (nameInput){
      nameInput.focus();
      nameInput.addEventListener("keydown", function(e){ if (e.key==="Enter") confirmNewDeck(); });
      document.getElementById("confirm-new-deck").onclick = confirmNewDeck;
      document.getElementById("cancel-new-deck").onclick = function(){ showNewDeckForm=false; renderHome(); };
    }

    function confirmNewDeck(){
      var name = nameInput.value.trim();
      if (!name){ nameInput.focus(); return; }
      var d = { id: uid(), name: name, color: TAB_COLORS[decks.length % TAB_COLORS.length], cards: [] };
      decks.push(d);
      persist();
      showNewDeckForm = false;
      toast("Mazo “"+name+"” creado.");
      go({view:"deck", deckId:d.id});
    }
  }

  var deckUiState = {}; // per-deck transient ui: search text, editingCardId, confirmingDeleteId, confirmingDeckDelete

  function uiFor(deckId){
    if (!deckUiState[deckId]) deckUiState[deckId] = { search:"", editingId:null, confirmDeleteId:null, confirmDeckDelete:false, showImport:false, editingName:false, reverse:false };
    return deckUiState[deckId];

  function practiceButtonHtml(status, label, count){
    var disabled = count < 2;
    return '<button class="btn quiz-filter-btn" data-status="'+status+'" '+(disabled?'disabled title="Se necesitan al menos 2 fichas en este grupo"':'')+'>'
      + esc(label) + ' <span class="mono">(' + count + ')</span></button>';
  }

  function renderPracticePanel(deck){
    var counts = statusCounts(deck);
    var total = deck.cards.length;
    var html = '<div class="practice-panel">';

    if (total === 0){
      html += '<p class="practice-empty">Añade fichas a este mazo para empezar a practicar y ver tu progreso aquí.</p>';
    } else {
      var pNew = counts["new"]/total*100;
      var pLearning = counts.learning/total*100;
      var ringStyle = 'background:conic-gradient(var(--ink-faint) 0 '+pNew+'%, var(--accent-2) '+pNew+'% '+(pNew+pLearning)+'%, var(--good) '+(pNew+pLearning)+'% 100%);';
      html += '<div class="progress-ring-wrap">'
        + '<div class="progress-ring" style="'+ringStyle+'"><div class="progress-ring-hole mono">'+counts.mastered+'/'+total+'</div></div>'
        + '<div class="progress-legend">'
        +   '<div class="legend-row"><span class="dot" style="background:var(--ink-faint)"></span>Nuevas <b class="mono">'+counts["new"]+'</b></div>'
        +   '<div class="legend-row"><span class="dot" style="background:var(--accent-2)"></span>En proceso <b class="mono">'+counts.learning+'</b></div>'
        +   '<div class="legend-row"><span class="dot" style="background:var(--good)"></span>Dominadas <b class="mono">'+counts.mastered+'</b></div>'
        + '</div>'
        + '</div>';
    }

    html += '<div class="practice-actions">'
      + '<p class="section-label" style="margin:0 0 10px;">Practicar</p>'
      + '<div class="filter-buttons">'
      +   practiceButtonHtml("all", "Todas", total)
      +   practiceButtonHtml("new", "Nuevas", counts["new"])
      +   practiceButtonHtml("learning", "En proceso", counts.learning)
      +   practiceButtonHtml("mastered", "Dominadas", counts.mastered)
      + '</div>'
      + '</div>';

    html += '</div>';
    return html;
  }

  function parseImportLines(text, sep){
    var delim = sep === "tab" ? "\t" : sep;
    var lines = text.split(/\r?\n/);
    var out = [];
    lines.forEach(function(line){
      if (!line.trim()) return;
      var idx = line.indexOf(delim);
      if (idx < 0) return;
      var term = line.slice(0, idx).trim();
      var def = line.slice(idx + delim.length).trim();
      if (term && def) out.push({ term: term, definition: def });
    });
    return out;
  }

  function wireDeckView(deck, ui){

      };
    });

    if (ui.editingName){

      document.getElementById("save-deck-name").onclick = saveName;

    // Add card
    var termInput = document.getElementById("f-term");

      deck.cards.push({ id: uid(), term: term, definition: def, status:"new" });

      renderDeckView(deck.id);

    document.getElementById("add-card-btn").onclick = addCard;

    // Search (re-render on each keystroke, then restore focus + caret so typing feels continuous)

    document.querySelectorAll(".save-edit").forEach(function(b){

  /* ===================== Quiz ===================== */
  var quiz = null;
  var autoAdvanceTimer = null;
  var FILTER_LABELS = { all:"Todas las fichas", "new":"Fichas nuevas", learning:"Fichas en proceso", mastered:"Fichas dominadas", missed:"Fichas falladas" };

  function beginQuiz(deck, opts){
    var pool;
    if (opts.cardIds){
      pool = deck.cards.filter(function(c){ return opts.cardIds.indexOf(c.id) >= 0; });
    } else {
      pool = poolByStatus(deck, opts.statusFilter);
    }
    if (pool.length < 2){ toast("Se necesitan al menos 2 fichas en ese grupo para hacer un test."); return; }
    quiz = {
      deckId: deck.id,
      reverse: opts.reverse,
      statusFilter: opts.statusFilter || "all",
      queue: shuffle(pool).map(function(c){ return c.id; }),
      cursor: 0,
      totalUnique: pool.length,
      score: 0,
      missedIds: [],
      answered: false,
      revealed: false,
      currentCardId: null,
      currentOptions: null
    };
    go({view:"quiz"});
  }

  // Reinserta una ficha fallada entre 4 y 10 fichas más adelante en la misma sesión.
  function requeueCard(cardId){
    var gap = 4 + Math.floor(Math.random() * 7); // 4..10
    var insertAt = Math.min(quiz.cursor + 1 + gap, quiz.queue.length);
    quiz.queue.splice(insertAt, 0, cardId);
  }

  function currentField(reverse, isPrompt){
    // prompt field is what's shown as the question; answer field is what's in the options
    if (isPrompt) return reverse ? "definition" : "term";
    return reverse ? "term" : "definition";
  }

  function buildOptions(deck, card, reverse){
    var answerField = currentField(reverse, false);
    var correct = card[answerField];
    var others = deck.cards
      .filter(function(c){ return c.id !== card.id; })
      .map(function(c){ return c[answerField]; });
    var uniqueOthers = [];
    others.forEach(function(v){
      if (v !== correct && uniqueOthers.indexOf(v) < 0) uniqueOthers.push(v);
    });
    var distractors = shuffle(uniqueOthers).slice(0, 3);
    return shuffle([correct].concat(distractors));
  }

  function renderQuizView(){
    var deck = findDeck(quiz.deckId);
    if (!deck || quiz.cursor >= quiz.queue.length){ go({view:"summary"}); return; }

    var cardId = quiz.queue[quiz.cursor];
    var card = deck.cards.find(function(c){ return c.id === cardId; });
    if (!card){ quiz.cursor++; renderQuizView(); return; } // ficha borrada durante la sesión: se salta

    // Cada vez que llegamos a una ficha nueva, se oculta de nuevo hasta que se pulse "Lo tengo".
    if (quiz.currentCardId !== card.id){
      quiz.currentCardId = card.id;
      quiz.currentOptions = null;
      quiz.revealed = false;
    }

    var promptField = currentField(quiz.reverse, true);
    var answerField = currentField(quiz.reverse, false);
    var progressPct = quiz.totalUnique ? Math.round((quiz.score / quiz.totalUnique) * 100) : 0;

    var html = '';
    html += '<div class="quiz-stage">';
    html += '<div class="quiz-top">'
      + '<span class="quiz-counter">Ficha ' + (quiz.cursor+1) + ' de ' + quiz.queue.length + '</span>'
      + '<div class="perforation"><div class="perforation-fill" style="width:'+progressPct+'%"></div></div>'
      + '<span class="score-pill">' + quiz.score + '/' + quiz.totalUnique + ' dominadas</span>'
      + '</div>';

    html += '<div class="quiz-card">'
      + '<p class="quiz-eyebrow">' + esc(deck.name) + ' · ' + esc(FILTER_LABELS[quiz.statusFilter]) + (quiz.reverse ? ' · definición → término' : ' · término → definición') + '</p>'
      + '<h2 class="quiz-term">' + esc(card[promptField]) + '</h2>'
      + '</div>';

    if (!quiz.revealed){
      html += '<div class="reveal-wrap"><button class="btn btn-primary reveal-btn" id="reveal-btn">Lo tengo</button></div>';
    } else {
      html += '<div class="options-grid">';
      var letters = ["A","B","C","D"];
      quiz.currentOptions.forEach(function(opt, i){
        html += '<button class="option-btn" data-value="'+esc(opt)+'"><span class="letter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
      });
      html += '</div>';
    }

    html += '<button class="btn btn-quiet quiz-exit" id="quiz-exit">Salir del test</button>';
    html += '</div>';

    app.innerHTML = html;

    if (!quiz.revealed){
      document.getElementById("reveal-btn").onclick = function(){
        quiz.currentOptions = buildOptions(deck, card, quiz.reverse);
        quiz.revealed = true;
        renderQuizView();
      };
    } else {
      var correctValue = card[answerField];
      var optionButtons = Array.prototype.slice.call(document.querySelectorAll(".option-btn"));
      optionButtons.forEach(function(btn){
        btn.addEventListener("click", function(){ handleAnswer(btn, correctValue, card, optionButtons); });
      });
    }

    document.getElementById("quiz-exit").onclick = function(){
      if (autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
      quiz = null;
      go({view:"deck", deckId: deck.id});
    };
  }

  function handleAnswer(btn, correctValue, card, allButtons){
    if (quiz.answered) return;
    quiz.answered = true;
    var picked = btn.getAttribute("data-value");
    var isCorrect = picked === correctValue;

    allButtons.forEach(function(b){
      b.disabled = true;
      var val = b.getAttribute("data-value");
      if (val === correctValue) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });

    updateMastery(card, isCorrect);
    persist();

    if (isCorrect){
      quiz.score++;
      autoAdvanceTimer = setTimeout(function(){ autoAdvanceTimer = null; advanceQuiz(); }, 700);
    } else {
      if (quiz.missedIds.indexOf(card.id) < 0) quiz.missedIds.push(card.id);
      requeueCard(card.id);
      var stage = document.querySelector(".quiz-stage");
      var nextBtn = el('<button class="btn btn-primary quiz-next">Siguiente ficha →</button>');
      nextBtn.onclick = advanceQuiz;
      var exitBtn = document.getElementById("quiz-exit");
      stage.insertBefore(nextBtn, exitBtn);
      nextBtn.focus();
    }
  }

  function advanceQuiz(){
    if (!quiz) return;
    if (autoAdvanceTimer){ clearTimeout(autoAdvanceTimer); autoAdvanceTimer = null; }
    quiz.cursor++;
    quiz.answered = false;
    renderQuizView();
  }

    html += '</div>';

    app.innerHTML = html;

    if (missedCards.length){

  document.addEventListener("keydown", function(e){
    if (route.view !== "quiz" || !quiz || e.key !== "Enter") return;

  /* ===================== Theme toggle ===================== */
  var THEME_KEY = "fichas.theme";
  var themeBtn = document.getElementById("theme-toggle");

  function getStoredTheme(){
    try{
      var t = localStorage.getItem(THEME_KEY);
      if (t === "light" || t === "dark") return t;
    }catch(e){}
    return "system";
  }

  function themeLabel(mode){
    if (mode === "light") return "Tema: Claro";
    if (mode === "dark") return "Tema: Oscuro";
    return "Tema: Auto";
  }

  function applyTheme(mode){
    var root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    if (themeBtn) themeBtn.innerHTML = '<span class="dot"></span>' + themeLabel(mode);
  }

  function cycleTheme(){
    var current = getStoredTheme();
    var next = current === "system" ? "light" : (current === "light" ? "dark" : "system");
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
    applyTheme(next);
  }

  applyTheme(getStoredTheme());
  if (themeBtn) themeBtn.addEventListener("click", cycleTheme);

  /* ===================== Auth gate ===================== */
  // Nota de seguridad: esta es una app de un solo archivo HTML sin servidor
  // detrás, así que no existe una autenticación "real" a prueba de todo.
  // Esto es solo un candado local: la contraseña no se guarda en texto
  // plano, se compara su huella SHA-256 contra un valor fijo.
  var AUTH_KEY = "fichas.auth.ok";
  var AUTH_SALT = "fichas-app-salt-v1::";
  var AUTH_HASH = "6b19b6aca3bbca493a778d3fec39ec7700efa768295828dfd1a164a55bc8a6cb";

  /* ===================== Sincronización en la nube (Netlify Functions) =====================
     Si este archivo se abre directamente (sin desplegar en Netlify), las llamadas a
     /.netlify/functions/... simplemente fallan y la app sigue funcionando en modo local,
     igual que antes. Solo cuando está desplegada en Netlify con las funciones activas
     entra en juego la sincronización real entre dispositivos. */
  var CLOUD_TOKEN_KEY = "fichas.cloud.token";
  var cloudToken = null;
  try{ cloudToken = localStorage.getItem(CLOUD_TOKEN_KEY); }catch(e){}
  var cloudSyncTimer = null;

  function serverLogin(u, p){
    return fetch("/.netlify/functions/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: u, pass: p })
    }).then(function(res){
      if (res.status === 404){
        var e = new Error("offline"); e.offline = true; throw e;
      }
      if (!res.ok){
        throw new Error("bad-credentials");
      }
      return res.json();
    }).then(function(data){
      return data.token;
    }, function(networkErr){
      if (networkErr && networkErr.offline) throw networkErr;
      var e = new Error("offline"); e.offline = true; throw e;
    });
  }

  function cloudFetch(path, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    if (cloudToken) opts.headers["Authorization"] = "Bearer " + cloudToken;
    return fetch(path, opts);
  }

  function pullCloudDecks(){
    return cloudFetch("/.netlify/functions/decks", { method: "GET" }).then(function(res){
      if (!res.ok) throw new Error("cloud-get-failed:" + res.status);
      return res.json();
    });
  }

  function pushCloudDecks(){
    if (!cloudToken) return;
    cloudFetch("/.netlify/functions/decks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(decks)
    }).then(function(res){
      setSyncBadge(res.ok ? "cloud" : "error");
    }).catch(function(){
      setSyncBadge("error");
    });
  }

  function schedulePush(){
    if (!cloudToken) return;
    clearTimeout(cloudSyncTimer);
    cloudSyncTimer = setTimeout(pushCloudDecks, 900);
  }

  function rotr(x, n){ return (x >>> n) | (x << (32 - n)); }

  function sha256Hex(message){
    var utf8 = unescape(encodeURIComponent(message));
    var bytes = [];
    for (var i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i));

    var K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
    ];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

    var msgLenBits = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0);
    bytes.push((msgLenBits >>> 24) & 0xff, (msgLenBits >>> 16) & 0xff, (msgLenBits >>> 8) & 0xff, msgLenBits & 0xff);

    for (var chunkStart = 0; chunkStart < bytes.length; chunkStart += 64){
      var w = new Array(64);
      for (var t = 0; t < 16; t++){
        var o = chunkStart + t * 4;
        w[t] = ((bytes[o] << 24) | (bytes[o+1] << 16) | (bytes[o+2] << 8) | (bytes[o+3])) >>> 0;
      }
      for (var t2 = 16; t2 < 64; t2++){
        var s0 = rotr(w[t2-15], 7) ^ rotr(w[t2-15], 18) ^ (w[t2-15] >>> 3);
        var s1 = rotr(w[t2-2], 17) ^ rotr(w[t2-2], 19) ^ (w[t2-2] >>> 10);
        w[t2] = (w[t2-16] + s0 + w[t2-7] + s1) >>> 0;
      }
      var a=H[0], b=H[1], c=H[2], d=H[3], e=H[4], f=H[5], g=H[6], h=H[7];
      for (var t3 = 0; t3 < 64; t3++){
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ ((~e) & g);
        var temp1 = (h + S1 + ch + K[t3] + w[t3]) >>> 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var temp2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d+temp1)>>>0; d=c; c=b; b=a; a=(temp1+temp2)>>>0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }

    var hex = "";
    for (var i2 = 0; i2 < 8; i2++){
      hex += ("00000000" + H[i2].toString(16)).slice(-8);
    }
    return hex;
  }

  var authForm = document.getElementById("auth-form");
  var authUser = document.getElementById("auth-user");
  var authPass = document.getElementById("auth-pass");
  var authError = document.getElementById("auth-error");
  var authCard = document.querySelector(".auth-card");
  var logoutBtn = document.getElementById("logout-btn");
  var syncBadge = document.getElementById("sync-badge");

  function isAuthed(){
    try{ return localStorage.getItem(AUTH_KEY) === "1"; }catch(e){ return false; }
  }

  function setSyncBadge(state){
    if (!syncBadge) return;
    if (state === "cloud"){
      syncBadge.textContent = "☁ Sincronizado";
      syncBadge.title = "Tus mazos se guardan también en la nube y se sincronizan entre dispositivos.";
      syncBadge.className = "sync-badge sync-cloud";
    } else if (state === "error"){
      syncBadge.textContent = "⚠ Sin conexión";
      syncBadge.title = "No se pudo sincronizar con la nube ahora mismo. Los cambios se guardan en este dispositivo y se subirán cuando vuelva la conexión.";
      syncBadge.className = "sync-badge sync-error";
    } else {
      syncBadge.textContent = "Solo en este dispositivo";
      syncBadge.title = "Esta versión no está conectada a Netlify, así que los mazos solo se guardan en este navegador.";
      syncBadge.className = "sync-badge sync-local";
    }
  }

  function unlockApp(){
    document.body.classList.add("authed");
    render();
    if (authUser) authUser.value = "";
    if (authPass) authPass.value = "";
  }

  function lockApp(){
    try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
    try{ localStorage.removeItem(CLOUD_TOKEN_KEY); }catch(e){}
    cloudToken = null;
    document.body.classList.remove("authed");
    if (authUser) setTimeout(function(){ authUser.focus(); }, 10);
  }

  function showAuthError(){
    authError.hidden = false;
    authPass.value = "";
    authPass.focus();
    if (authCard){
      authCard.classList.remove("shake");
      void authCard.offsetWidth;
      authCard.classList.add("shake");
    }
  }

  function localAuthAttempt(u, p){
    var attemptHash = sha256Hex(AUTH_SALT + u + "::" + p);
    if (attemptHash === AUTH_HASH){
      authError.hidden = true;
      try{ localStorage.setItem(AUTH_KEY, "1"); }catch(err){}
      setSyncBadge("local");
      unlockApp();
    } else {
      showAuthError();
    }
  }

  function syncFromCloudOnLogin(){
    return pullCloudDecks().then(function(cloudDecks){
      if (cloudDecks && Array.isArray(cloudDecks) && cloudDecks.length){
        decks = migrateDecks(cloudDecks);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); }catch(err){}
      } else {
        // Todavía no hay nada guardado en la nube: subimos lo que ya tengamos en este dispositivo.
        pushCloudDecks();
      }
      setSyncBadge("cloud");
    }).catch(function(){
      // El login en el servidor funcionó pero la primera sincronización falló
      // (por ejemplo, sin conexión en ese instante): seguimos con los datos locales.
      setSyncBadge("error");
    });
  }

  if (authForm){
    authForm.addEventListener("submit", function(e){
      e.preventDefault();
      var u = (authUser.value || "").trim();
      var p = authPass.value || "";
      authError.hidden = true;

      serverLogin(u, p).then(function(token){
        cloudToken = token;
        try{ localStorage.setItem(CLOUD_TOKEN_KEY, token); }catch(err){}
        try{ localStorage.setItem(AUTH_KEY, "1"); }catch(err){}
        return syncFromCloudOnLogin();
      }).then(function(){
        unlockApp();
      }).catch(function(err){
        if (err && err.offline){
          // No hay backend de Netlify disponible (p. ej. archivo abierto directamente): candado local.
          localAuthAttempt(u, p);
        } else {
          showAuthError();
        }
      });
    });
  }

  if (logoutBtn){
    logoutBtn.addEventListener("click", lockApp);
  }

  if (isAuthed()){
    unlockApp();
    if (cloudToken){
      pullCloudDecks().then(function(cloudDecks){
        if (cloudDecks && Array.isArray(cloudDecks)){
          decks = migrateDecks(cloudDecks);
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(decks)); }catch(err){}
          render();
        }
        setSyncBadge("cloud");
      }).catch(function(){ setSyncBadge("error"); });
    } else {
      setSyncBadge("local");
    }
  } else if (authUser){
    setTimeout(function(){ authUser.focus(); }, 10);
  }
})();
</script>
